<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KaamWala Admin</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { background: var(--bg); }
    header { background: var(--navy); color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 16px; }
    header nav { display: flex; gap: 6px; flex-wrap: wrap; }
    header nav button { background: transparent; border: 0; color: rgba(255,255,255,.7); font-weight: 700; padding: 8px 12px; border-radius: 8px; }
    header nav button.on { background: rgba(255,255,255,.12); color: #fff; }
    main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .kpi { background: #fff; border-radius: 12px; padding: 14px 16px; }
    .kpi .v { font-size: 22px; font-weight: 900; } .kpi .l { color: var(--muted); font-size: 12px; }
    .tbl { background: #fff; border-radius: 12px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; background: #f7f9fb; }
    td select, td input { border: 1px solid var(--line); border-radius: 8px; padding: 5px 7px; font-size: 13px; max-width: 160px; }
    td .btn.sm { padding: 6px 12px; }
    h2 { font-size: 17px; margin: 0 0 12px; }
    .muted { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="logo"><span class="logo-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3 8.5-7 10-4-1.5-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg></span><span>Kaam<b>Wala</b> admin</span></div>
    <nav id="nav"></nav><span class="spacer"></span><button class="lang" id="lo">Log out</button>
  </header>
  <main id="main"></main>
  <script>
  (() => {
    let token = null;
    try { token = localStorage.getItem('kw_token'); } catch {}
    if (!token) { location.href = '/'; return; }
    const e = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
    const rs = (n) => 'Rs ' + Number(n || 0).toLocaleString('en-PK');
    const api = async (path, opts = {}) => {
      const r = await fetch(path, { method: opts.method || (opts.body ? 'POST' : 'GET'), headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: opts.body ? JSON.stringify(opts.body) : undefined });
      const d = await r.json();
      if (r.status === 401 || r.status === 403) { location.href = '/'; throw new Error(d.error); }
      if (!r.ok) { alert(d.error); throw new Error(d.error); }
      return d;
    };
    const tabs = { workers: 'Worker verification', addons: 'Add-on review', disputes: 'Disputes', escrow: 'Escrow & payouts', reports: 'Complaints' };
    let tab = location.hash.slice(1) || 'workers';
    let data, addonData, verData;
    const DOC = { cnic_front: 'CNIC front', cnic_back: 'CNIC back', selfie: 'Selfie with CNIC', certificate: 'Certificate', other: 'Other' };
    const VER = { verified: '#0f8f7c', pending: '#9a5b00', unsubmitted: '#6b7a89', rejected: '#d64545' };

    async function load() { [data, addonData, verData] = await Promise.all([api('/api/admin/overview'), api('/api/admin/addons'), api('/api/admin/verifications')]); render(); }

    function render() {
      document.getElementById('nav').innerHTML = Object.entries(tabs).map(([k, v]) => {
        const n = k === 'workers' ? verData.workers.filter((w) => w.verification === 'pending').length : k === 'addons' ? addonData.addons.filter((x) => x.flags.length && ['pending', 'approved', 'disputed'].includes(x.status)).length : k === 'disputes' ? data.disputes.filter((d) => d.status === 'open').length : k === 'escrow' ? data.payouts.filter((p) => p.payout_status === 'pending').length : k === 'reports' ? data.reports.length : 0;
        return `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${v}${n ? ` (${n})` : ''}</button>`;
      }).join('');
      const m = document.getElementById('main');
      const kpis = `<div class="kpis">
        <div class="kpi"><div class="v">${rs(data.totals.in_escrow)}</div><div class="l">Held in escrow now</div></div>
        <div class="kpi"><div class="v">${rs(data.totals.commission)}</div><div class="l">Commission earned</div></div>
        <div class="kpi"><div class="v">${data.disputes.filter((d) => d.status === 'open').length}</div><div class="l">Open disputes</div></div>
        <div class="kpi"><div class="v">${data.payouts.filter((p) => p.payout_status === 'pending').length}</div><div class="l">Transfers to send</div></div>
        <div class="kpi"><div class="v" style="font-size:14px">JazzCash: ${data.providers.jazzcash}<br>EasyPaisa: ${data.providers.easypaisa}</div><div class="l">Payment providers</div></div>
      </div>`;
      if (tab === 'workers') {
        const queue = verData.workers.filter((w) => w.verification !== 'verified');
        m.innerHTML = kpis + `<h2>Verification queue</h2><p class="muted">New worker sign-ups stay hidden from customers until you verify them here. Open both sides of the CNIC and compare the name and photo before verifying. Uploading documents never verifies a worker on its own. Documents are private and only open for admins.</p>
        <div class="tbl" style="margin-bottom:24px"><table><tr><th>Worker</th><th>Service</th><th>Documents</th><th>Status</th><th>Decision</th></tr>
        ${queue.map((w) => `<tr><td><b>${e(w.name)}</b><div class="muted">${e(w.phone)}${w.email ? ' · ' + e(w.email) : ''}</div><div class="muted">Joined ${w.created_at ? new Date(w.created_at).toLocaleDateString() : '–'}</div></td>
          <td>${e(w.category)} · ${w.exp_years} yrs<div class="muted">${e(w.areas)}, ${e(w.city)} · from ${rs(w.visit_fee)}</div><div class="muted">${e(w.bio || '')}</div></td>
          <td>${w.documents.map((d) => `<button class="btn sm ghost" style="margin:2px" data-doc="${d.id}">${DOC[d.kind]}</button>`).join('') || '<span class="muted">None yet</span>'}</td>
          <td><b style="color:${VER[w.verification]}">${w.verification}</b>${w.verification_note ? `<div class="muted">${e(w.verification_note)}</div>` : ''}</td>
          <td><input id="vn${w.id}" placeholder="Note (required to reject)" style="max-width:200px"><div style="margin-top:6px"><button class="btn sm" data-verify="${w.id}">Verify</button> <button class="btn sm danger" data-reject="${w.id}">Reject</button></div></td></tr>`).join('') || '<tr><td colspan="5" class="muted">No workers waiting for verification.</td></tr>'}
        </table></div>
        <h2>All workers: background checks</h2><p class="muted">Only verified, active workers who are available are listed in the app. Never mark a skill as passed unless the test or certificate was checked.</p>
        <div class="tbl"><table><tr><th>Worker</th><th>Category</th><th>Verification</th><th>Phone & address</th><th>References</th><th>Skill</th><th>Experience</th><th>Rating</th><th>Status</th></tr>
        ${data.workers.map((w) => `<tr><td><b>${e(w.name)}</b><div class="muted">${e(w.phone)}</div></td><td>${e(w.category)}</td>
          <td><b style="color:${VER[w.verification]}">${w.verification}</b>${w.verified_at ? `<div class="muted">${new Date(w.verified_at).toLocaleDateString()}</div>` : ''}</td>
          <td><input type="checkbox" data-w="${w.id}" data-k="phone_address_verified" ${w.phone_address_verified ? 'checked' : ''}></td>
          <td><input type="number" min="0" max="5" style="width:60px" data-w="${w.id}" data-k="references_checked" value="${w.references_checked}"></td>
          <td><select data-w="${w.id}" data-k="skill_assessment">${['pending', 'passed', 'none'].map((s) => `<option ${s === w.skill_assessment ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
          <td>${w.exp_years} yrs <label class="muted"><input type="checkbox" data-w="${w.id}" data-k="exp_documented" ${w.exp_documented ? 'checked' : ''}> documented</label></td>
          <td>${w.rating ?? '–'} (${w.review_count})</td>
          <td><select data-w="${w.id}" data-k="status">${['active', 'pending', 'suspended'].map((s) => `<option ${s === w.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td></tr>`).join('')}
        </table></div>`;
      } else if (tab === 'addons') {
        const st = { pending: 'amber', approved: '', rejected: 'red', cancelled: 'navy', disputed: 'amber' };
        m.innerHTML = kpis + `<h2>Workers to watch (last 30 days)</h2>
        <p class="muted">Flagged at 3 or more rejected/disputed add-ons, or 3 or more over the price warning line. Price warning line: over ${addonData.warn_percent}% of the original booking or Rs ${addonData.warn_amount} in add-ons.</p>
        <div class="tbl"><table><tr><th>Worker</th><th>Requested</th><th>Approved</th><th>Rejected</th><th>Disputed</th><th>Over limit</th><th>Approved value</th><th>Status</th><th></th></tr>
        ${addonData.workers.map((w) => `<tr><td><b>${e(w.name)}</b> ${w.flagged ? '<span class="badge red">Repeated misuse?</span>' : ''}</td><td>${w.requested}</td><td>${w.approved}</td><td>${w.rejected}</td><td>${w.disputed}</td><td>${w.over_threshold}</td><td>${rs(w.approved_amount)}</td>
          <td>${e(w.status)}</td><td>${w.status !== 'suspended' ? `<button class="btn sm danger" data-suspend="${w.id}">Suspend</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="9" class="muted">No add-ons yet.</td></tr>'}
        </table></div>
        <h2 style="margin-top:24px">Add-on requests</h2>
        <div class="tbl"><table><tr><th>Booking</th><th>Worker → customer</th><th>Work</th><th>Labour + materials</th><th>vs original</th><th>Status</th><th>Flags</th><th></th></tr>
        ${addonData.addons.map((x) => `<tr><td><b>${e(x.code)}</b><div class="muted">${new Date(x.created_at).toLocaleString()}</div></td>
          <td>${e(x.worker_name)}<div class="muted">→ ${e(x.customer_name)}</div></td>
          <td>${e(x.work)}<div class="muted">${e(x.problem)}</div>${x.safety_risk ? `<div class="muted" style="color:var(--red)">Safety: ${e(x.safety_risk)}</div>` : ''}${x.message_count ? `<div class="muted">${x.message_count} message(s)</div>` : ''}</td>
          <td>${rs(x.labour)} + ${rs(x.materials)}<div><b>${rs(x.amount)}</b></div></td>
          <td>+${x.increase_percent}%<div class="muted">orig. ${rs(x.visit_fee)}</div></td>
          <td><span class="badge ${st[x.status]}">${e(x.status)}</span><div class="muted">${e(x.pay_status)}</div></td>
          <td>${x.flags.map((f) => `<span class="badge ${f === 'safety' ? 'red' : 'amber'}">${e(f)}</span>`).join(' ')}</td>
          <td><button class="btn sm ghost" data-hist="${x.booking_id}">History</button></td></tr>`).join('') || '<tr><td colspan="8" class="muted">No add-ons yet.</td></tr>'}
        </table></div><div id="hist"></div>`;
      } else if (tab === 'disputes') {
        m.innerHTML = kpis + `<h2>Disputes</h2><p class="muted">Money stays frozen in escrow until you resolve. Enter how much to refund to the customer; the rest goes to the worker (less commission).</p>
        <div class="tbl"><table><tr><th>Booking</th><th>Raised by</th><th>Reason</th><th>In escrow</th><th>Resolution</th></tr>
        ${data.disputes.map((d) => `<tr><td><b>${e(d.code)}</b><div class="muted">${new Date(d.created_at).toLocaleString()}</div></td><td>${e(d.raised_by_name)}</td><td>${d.addon_work ? `<span class="badge amber">Add-on: ${e(d.addon_work)} · ${rs(d.addon_amount)}</span><br>` : ''}${e(d.reason)}</td>
          <td>${d.status === 'open' ? rs(d.available) : '—'}</td>
          <td>${d.status === 'open' ? `<div style="display:grid;gap:6px;max-width:260px">
              <input placeholder="Refund to customer (Rs)" type="number" min="0" max="${d.available}" id="ra${d.id}" value="0">
              <input placeholder="Resolution note" id="rn${d.id}">
              <div style="display:flex;gap:6px"><button class="btn sm" data-resolve="${d.id}">Resolve</button>
              <button class="btn sm ghost" data-full="${d.id}" data-amt="${d.available}">Full refund</button></div></div>`
            : `<span class="badge navy">Resolved</span> ${e(d.resolution)}<div class="muted">Refunded ${rs(d.refund_amount)}</div>`}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No disputes.</td></tr>'}
        </table></div>`;
      } else if (tab === 'escrow') {
        m.innerHTML = kpis + `<h2>Transfers to send</h2><p class="muted">Released and refunded amounts. Send each one from the JazzCash / EasyPaisa merchant portal (or your disbursement API), then mark it sent.</p>
        <div class="tbl"><table><tr><th>Booking</th><th>Type</th><th>To</th><th>Amount</th><th>Via</th><th>Note</th><th></th></tr>
        ${data.payouts.map((p) => `<tr><td>${e(p.code)}</td><td>${p.type === 'release' ? 'Worker payout' : 'Customer refund'}</td>
          <td>${p.type === 'release' ? `${e(p.worker_name)}<div class="muted">${e(p.payout_provider || '')} ${e(p.payout_wallet || 'no wallet set')}</div>` : `${e(p.customer_name)}<div class="muted">${e(p.customer_phone)}</div>`}</td>
          <td><b>${rs(p.amount)}</b></td><td>${e(p.provider || '')}</td><td class="muted">${e(p.note || '')}</td>
          <td>${p.payout_status === 'pending' ? `<button class="btn sm" data-sent="${p.id}">Mark sent</button>` : '<span class="badge">Sent</span>'}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">Nothing yet.</td></tr>'}
        </table></div>
        <h2 style="margin-top:24px">Escrow accounts</h2>
        <div class="tbl"><table><tr><th>Booking</th><th>Job status</th><th>Escrow</th><th>Paid in</th><th>To worker</th><th>Commission</th><th>Refunded</th><th>Auto-release</th></tr>
        ${data.escrows.map((x) => `<tr><td>${e(x.code)}</td><td>${e(x.status)}</td><td><span class="badge ${x.state === 'disputed' ? 'amber' : ''}">${e(x.state)}</span></td><td>${rs(x.held)}</td><td>${rs(x.released)}</td><td>${rs(x.commission)}</td><td>${rs(x.refunded)}</td><td class="muted">${x.auto_release_at ? new Date(x.auto_release_at).toLocaleString() : ''}</td></tr>`).join('')}
        </table></div><p><button class="btn sm ghost" id="ar">Run auto-release now</button></p>`;
      } else {
        m.innerHTML = kpis + `<h2>Complaints & misconduct reports</h2><div class="tbl"><table><tr><th>When</th><th>From</th><th>Worker</th><th>Booking</th><th>Report</th></tr>
        ${data.reports.map((r) => `<tr><td class="muted">${new Date(r.created_at).toLocaleString()}</td><td>${e(r.reporter)}</td><td>${e(data.workers.find((w) => w.id === r.worker_id)?.name || '')}</td><td>${r.booking_id || ''}</td><td>${e(r.body)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No reports.</td></tr>'}
        </table></div>`;
      }
    }

    document.addEventListener('click', async (ev) => {
      const b = ev.target.closest('button'); if (!b) return;
      if (b.dataset.tab) { tab = b.dataset.tab; location.hash = tab; render(); }
      if (b.id === 'lo') { try { localStorage.removeItem('kw_token'); } catch {} location.href = '/'; }
      if (b.dataset.suspend && confirm('Suspend this worker? They will be hidden from customers.')) { await api(`/api/admin/workers/${b.dataset.suspend}`, { method: 'PATCH', body: { status: 'suspended' } }); load(); }
      if (b.dataset.hist) {
        const h = await api(`/api/admin/bookings/${b.dataset.hist}/history`);
        document.getElementById('hist').innerHTML = `<h2 style="margin-top:24px">Price history</h2><div class="tbl"><table><tr><th>When</th><th>Who</th><th>Event</th><th>Amount</th><th>Approved total after</th><th>Note</th></tr>
          ${h.events.map((ev) => `<tr><td class="muted">${new Date(ev.created_at).toLocaleString()}</td><td>${e(ev.actor_name || ev.actor_role)}</td><td>${e(ev.event)}</td><td>${ev.amount != null ? rs(ev.amount) : ''}</td><td><b>${rs(ev.approved_total)}</b></td><td class="muted">${e(ev.note || '')}</td></tr>`).join('')}
          </table></div><p class="muted">Approved ${rs(h.price.approved_total)} · paid ${rs(h.price.paid)} · refunded ${rs(h.price.refunded)} · unpaid ${rs(h.price.unpaid)}</p>`;
        document.getElementById('hist').scrollIntoView({ behavior: 'smooth' });
      }
      if (b.dataset.doc) {
        const r = await fetch(`/api/documents/${b.dataset.doc}`, { headers: { Authorization: 'Bearer ' + token } });
        if (!r.ok) return alert('Could not open the document');
        window.open(URL.createObjectURL(await r.blob()), '_blank');
      }
      if (b.dataset.verify && confirm('Verify this worker? Customers will see the Verified Worker badge and can book them.')) {
        await api(`/api/admin/workers/${b.dataset.verify}/verification`, { body: { decision: 'verified', note: document.getElementById('vn' + b.dataset.verify).value } }); load();
      }
      if (b.dataset.reject) { await api(`/api/admin/workers/${b.dataset.reject}/verification`, { body: { decision: 'rejected', note: document.getElementById('vn' + b.dataset.reject).value } }); load(); }
      if (b.dataset.sent) { await api(`/api/admin/ledger/${b.dataset.sent}/sent`, { body: {} }); load(); }
      if (b.id === 'ar') { const r = await api('/api/admin/auto-release', { body: {} }); alert(`Released ${r.released} escrow(s)`); load(); }
      if (b.dataset.full) { document.getElementById('ra' + b.dataset.full).value = b.dataset.amt; }
      if (b.dataset.resolve) {
        const id = b.dataset.resolve;
        await api(`/api/admin/disputes/${id}/resolve`, { body: { refund_amount: document.getElementById('ra' + id).value, resolution: document.getElementById('rn' + id).value } });
        load();
      }
    });
    document.addEventListener('change', async (ev) => {
      const el = ev.target; if (!el.dataset.w) return;
      const v = el.type === 'checkbox' ? (el.checked ? 1 : 0) : el.type === 'number' ? Number(el.value) : el.value;
      await api(`/api/admin/workers/${el.dataset.w}`, { method: 'PATCH', body: { [el.dataset.k]: v } });
      load();
    });
    window.addEventListener('hashchange', () => { tab = location.hash.slice(1) || 'workers'; render(); });
    load();
  })();
  </script>
</body>
</html>
